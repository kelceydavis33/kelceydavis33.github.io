# ---------------------------------------------------------------------------
# Research topics.
#
# This one file does two jobs:
#   1. the site reads "name", "blurb", "url" and "image" to build the pages
#   2. scripts/update_publications.py reads "keywords", "always" and "never"
#      to decide which papers appear on each topic page
#
# A paper lands on a topic page if any keyword below appears in its title,
# abstract or ADS keywords. Case does not matter, and matching is on whole
# words, so "LRD" will not match "hybrids".
#
# When the keywords get it wrong, fix it by hand:
#   always:  bibcodes that should appear no matter what the keywords say
#   never:   bibcodes that should never appear, no matter what
# A bibcode looks like 2024ApJ...968...19D and sits at the top of every ADS
# abstract page.
#
# Changing the order of the three blocks below changes the order of the
# navigation and of the cards on the homepage.
# ---------------------------------------------------------------------------

lrd:
  name: Little Red Dots
  blurb: >-
    Compact sources with v-shaped energy ditributions discovered by JWST
  url: /research/little-red-dots/
  image: /assets/img/lrds.png
  image_alt: Image cutout of a little red dot from Kocevki 2024
  image_caption: Image cutout of a little red dot from Kocevki 2024
  keywords:
    - Little Red Dots
    - Active Galactic Nuclei
    - Broad Absorption-line LRDs
    -JWST NIRSpec
  always: []
  never: []

eelg:
  name: Extreme Emission Line Galaxies
  blurb: >-
    Extremely strong rest-optical line emission at Cosmic Dawn as seen by JWST
  url: /research/extreme-emission-line-galaxies/
  image: /assets/img/eelg-thumb.jpg
  image_alt: Brightest 100 EELGs in the sample from Davis 2024
  image_caption: Brightest 100 EELGs in the sample from Davis 2024
  keywords:
    - Extreme Emission Line Galaxies
    - Star Formation Histories
    - Emission Line Morphology
  always: []
  never: []

survey:
  name: Survey Design
  blurb: >-
    Desiging NIRCam and NIRSpec observations for JWST and other future missions. 
  url: /research/survey-design/
  image: /assets/img/SPAM-can-logo.png
  image_alt: SPAM survey logo
  image_caption: SPAM survey logo
  keywords:
    - medium-band photometry
    - deep field images
    - JWST NIRCam
    - JWST NIRSpec
    - photometric surveys
  always: []
  never: []
